<!doctype html>

<meta charset="utf-8">

<title>DK員工專屬賣場</title>
<style>
:root{
  --bg:#f6f4f0; --card:#ffffff; --ink:#1c2540; --muted:#6b7080; --line:#e4e0d8;
  --brand:#1c2540; --accent:#c48c48; --chip:#ece8e0; --ok:#2f7d4f;
}
@media (prefers-color-scheme: dark){
  :root{ --bg:#14171f; --card:#1d2130; --ink:#eef0f6; --muted:#a0a6b8; --line:#2c3144;
         --brand:#0f1320; --chip:#2a2f42; }
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif;}
header{background:var(--brand);color:#fff;padding:28px 16px 22px;text-align:center}
header h1{margin:0;font-size:24px;letter-spacing:1px}
header p{margin:6px 0 0;color:var(--accent);font-size:15px}
.mylink{display:inline-block;margin-top:14px;background:var(--accent);color:#1c2540;text-decoration:none;font-weight:700;
  padding:9px 18px;border-radius:999px;font-size:15px}
.wrap{max-width:980px;margin:0 auto;padding:16px}
.search{position:sticky;top:0;z-index:5;background:var(--bg);padding:12px 0 8px}
.search input{width:100%;font-size:17px;padding:12px 14px;border-radius:10px;border:1px solid var(--line);
  background:var(--card);color:var(--ink)}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0 4px}
.chip{border:0;background:var(--chip);color:var(--ink);padding:7px 14px;border-radius:999px;font-size:14px;cursor:pointer}
.chip.on{background:var(--ink);color:var(--bg)}
.hint{color:var(--muted);font-size:13px;margin:6px 2px 14px}
details.store{background:var(--card);border:1px solid var(--line);border-radius:12px;margin:10px 0;overflow:hidden}
details.store summary{list-style:none;cursor:pointer;padding:14px 16px;display:flex;align-items:center;gap:10px}
details.store summary::-webkit-details-marker{display:none}
.sname{font-weight:700;font-size:17px}
.scode{color:var(--muted);font-size:13px}
.scount{margin-left:auto;color:var(--muted);font-size:13px;white-space:nowrap}
.arrow{transition:transform .2s;color:var(--muted)}
details[open] .arrow{transform:rotate(90deg)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px;padding:0 14px 14px}
.emp{border:1px solid var(--line);border-radius:10px;padding:12px;text-align:center;background:var(--bg)}
.emp.hl{outline:3px solid var(--accent)}
.emp img{width:100%;max-width:200px;aspect-ratio:800/1060;object-fit:contain;background:#fff;border-radius:6px}
.who{font-size:18px;font-weight:700;margin:8px 0 2px}
.eid{color:var(--muted);font-size:14px;margin-bottom:10px}
.btns{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.btn{display:block;border:1px solid var(--line);background:var(--card);color:var(--ink);text-decoration:none;
  padding:9px 6px;border-radius:8px;font-size:14px;cursor:pointer}
.btn.main{grid-column:1/-1;background:var(--ink);color:var(--bg);border-color:var(--ink)}
.pending{color:var(--muted);font-size:14px;padding:30px 0}
.storezip{padding:0 14px 14px}
.storezip a{font-size:14px;color:var(--accent)}
.empty{text-align:center;color:var(--muted);padding:40px 0}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ok);color:#fff;
  padding:10px 18px;border-radius:999px;font-size:15px;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.show{opacity:1}
footer{text-align:center;color:var(--muted);font-size:12px;padding:20px 16px 40px}
</style>
</head>

const API = "https://script.google.com/macros/s/AKfycbzOXppp9hEQeYuir5ut4NHgEJRK-4aSYHYWjggnPVsDLAshPCy00xK4QebmMEiKCVYUSg/exec";
const $ = s => document.querySelector(s);
// 使用紀錄：只送員工編號／門市／動作到後台，失敗不影響頁面
const viewed = new Set();
function track(act, eid, store){
  if (!API || API.startsWith("__")) return;
  try { navigator.sendBeacon(API, JSON.stringify({action: "track", act, eid: eid || "", store: store || ""})); } catch {}
}
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
let region = "全部";

const stores = [];
const byDept = {};
for (const r of DATA) {
  if (!byDept[r.dept]) { byDept[r.dept] = {dept:r.dept, region:r.region, code:r.code, name:r.store, zip:r.zip, emps:[]}; stores.push(byDept[r.dept]); }
  byDept[r.dept].emps.push(r);
}
stores.sort((a,b) => a.dept.localeCompare(b.dept, "zh-Hant"));
const regions = ["全部", ...new Set(stores.map(s => s.region))];

function chips(){
  $("#chips").innerHTML = regions.map(r => `<button class="chip${r===region?" on":""}" data-r="${esc(r)}">${esc(r)}</button>`).join("");
}
$("#chips").addEventListener("click", e => {
  const b = e.target.closest(".chip"); if (!b) return;
  region = b.dataset.r; chips(); render();
});

function empCard(r, hl){
  const body = r.url
    ? `<img loading="lazy" src="qr/${esc(r.eid)}.png" alt="${esc(r.eid)} QR code">
       <div class="who">${esc(r.masked)}</div><div class="eid">員工編號 ${esc(r.eid)}</div>
       <div class="btns">
         <a class="btn main" href="${esc(r.url)}" target="_blank" rel="noopener" data-track="open" data-eid="${esc(r.eid)}">開啟專屬賣場</a>
         <button class="btn" data-copy="${esc(r.url)}" data-eid="${esc(r.eid)}">複製連結</button>
         <a class="btn" href="qr/${esc(r.eid)}.png" download="DK專屬賣場_${esc(r.eid)}.png" data-track="download" data-eid="${esc(r.eid)}">下載 QR</a>
       </div>`
    : `<div class="who">${esc(r.masked)}</div><div class="eid">員工編號 ${esc(r.eid)}</div>
       <div class="pending">連結準備中</div>`;
  return `<div class="emp${hl?" hl":""}" id="e-${esc(r.eid)}">${body}</div>`;
}

function render(){
  const q = $("#q").value.trim().toLowerCase();
  let html = "", shown = 0;
  for (const s of stores) {
    if (region !== "全部" && s.region !== region) continue;
    const storeHit = q && (s.dept.toLowerCase().includes(q));
    const emps = q && !storeHit ? s.emps.filter(r => r.eid.toLowerCase().includes(q) || r.masked.includes(q)) : s.emps;
    if (!emps.length) continue;
    shown++;
    const open = q ? " open" : "";
    const exact = q && emps.length === 1 && emps[0].eid.toLowerCase() === q;
    html += `<details class="store"${open}>
      <summary><span class="arrow">▶</span><span class="sname">${esc(s.name)}</span>
        <span class="scode">${esc(s.code)}</span><span class="scount">${s.emps.length} 人</span></summary>
      <div class="grid">${emps.map(r => empCard(r, exact)).join("")}</div>
      ${s.zip ? `<div class="storezip"><a href="zip/${esc(s.zip)}" download="${esc(s.dept)}_QR.zip" data-track="zip" data-store="${esc(s.dept)}">⬇ 下載全店 QR code（zip）</a></div>` : ""}
    </details>`;
  }
  $("#list").innerHTML = html || `<div class="empty">找不到符合的門市或員工編號</div>`;
  // 輸入完整員工編號、只剩自己一張卡 → 記一次「看到卡片」
  const one = q && DATA.filter(r => r.eid.toLowerCase() === q);
  if (one && one.length === 1 && !viewed.has(one[0].eid)) { viewed.add(one[0].eid); track("view", one[0].eid); }
}

$("#q").addEventListener("input", render);
document.addEventListener("click", async e => {
  const tr = e.target.closest("[data-track]");
  if (tr) track(tr.dataset.track, tr.dataset.eid, tr.dataset.store);
  const b = e.target.closest("[data-copy]"); if (!b) return;
  track("copy", b.dataset.eid);
  try { await navigator.clipboard.writeText(b.dataset.copy); }
  catch { const t = document.createElement("textarea"); t.value = b.dataset.copy; document.body.appendChild(t); t.select(); document.execCommand("copy"); t.remove(); }
  const t = $("#toast"); t.classList.add("show"); setTimeout(() => t.classList.remove("show"), 1400);
});

// 深層連結：#0026 直接帶出該員工
function fromHash(){
  const h = decodeURIComponent(location.hash.slice(1));
  if (h) { $("#q").value = h; region = "全部"; chips(); }
  render();
}
window.addEventListener("hashchange", fromHash);
chips(); fromHash();
</script>
